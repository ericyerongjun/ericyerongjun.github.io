<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Publications — YE RONGJUN</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main-area">
    <div class="page-header">
      <h1>Publications</h1>
      <p>Research papers and preprints</p>
    </div>

    <div class="page-body">
      <div class="card">
        <div class="section-title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a1 1 0 0 1 0-5H20"/></svg>
          Papers
        </div>

        <div class="pub-list">
          <div class="pub-item">
            <div class="pub-title">[Title hidden]</div>
            <div class="pub-authors"><span class="me">Rongjun Ye</span>, Xiao Huang</div>
            <div class="pub-venue">ICLR 2027 (In Preparation)</div>
            <span class="tag" style="margin-top:6px;display:inline-block;">In Preparation</span>
            <p style="font-size:14px;color:var(--text-body);margin-top:8px;line-height:1.6;">[Details available upon request]</p>
            <div class="pub-links">
              <span class="pub-link btn-disabled" aria-disabled="true">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                Paper
              </span>
              <span class="pub-link btn-disabled" aria-disabled="true">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
                Code
              </span>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="assets/js/sidebar.js"></script>
</body>
</html>
