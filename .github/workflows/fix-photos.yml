name: fix-photos
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/fix-photos.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vendor photographs onto GitHub Pages
        run: |
          python3 << 'PY'
          import urllib.request
          from pathlib import Path
          pairs = [
              ("hero-earth.jpg", "https://i.imgur.com/8ifShZg.jpeg"),
              ("chapter-inference.jpg", "https://i.imgur.com/mNCc1H3.jpeg"),
              ("chapter-silicon.jpg", "https://i.imgur.com/R9rJHAj.jpeg"),
              ("chapter-campus.jpg", "https://i.imgur.com/vdN1nnP.jpeg"),
              ("chapter-horizon.jpg", "https://i.imgur.com/IRnOHTk.jpeg"),
              ("portrait.jpg", "https://i.imgur.com/xcGnuN6.jpeg"),
          ]
          repl = {}
          for name, url in pairs:
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              data = urllib.request.urlopen(req, timeout=60).read()
              if not data.startswith(b"\xff\xd8\xff") or len(data) < 10000:
                  raise SystemExit(f"{name} is not a usable jpeg ({len(data)} bytes)")
              Path(name).write_bytes(data)
              repl[url] = "/" + name
              print(name, len(data))
          for html_name in ("index.html", "404.html"):
              path = Path(html_name)
              text = path.read_text()
              for old, new in repl.items():
                  count = text.count(old)
                  if count != 2:
                      raise SystemExit(f"{html_name} {old} count {count}")
                  text = text.replace(old, new)
              if "favicon.svg?v=4" not in text or text.count("&") < 10 or "i.imgur.com" in text:
                  raise SystemExit(html_name + " sanity check failed")
              path.write_text(text)
              print("html", html_name, len(text))
          PY
      - name: Commit
        run: |
          git config user.name "Eric"
          git config user.email "yerongjun03@gmail.com"
          git add hero-earth.jpg chapter-inference.jpg chapter-silicon.jpg chapter-campus.jpg chapter-horizon.jpg portrait.jpg index.html 404.html
          git rm -f .github/workflows/fix-photos.yml
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "Host the chapter photographs on the site [skip ci]"
          git push
